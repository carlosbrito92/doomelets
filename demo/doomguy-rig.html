<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doom Slayer · Pixel Rig</title>
<style>
  :root{--bg:#15110f;--panel:#1d1815;--rule:#4a3a30;--ink:#e8dcc4;--soft:#9a8c78;--hot:#d8571a;--green:#6fb04a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
  h1{margin:0;font:800 26px/1 Impact,'Arial Narrow',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--hot)}
  header{padding:14px 18px;border-bottom:1px solid var(--rule)}
  header p{margin:4px 0 0;color:var(--soft)}
  main{display:grid;grid-template-columns:minmax(320px,1fr) 360px;gap:0;min-height:calc(100vh - 70px)}
  @media(max-width:860px){main{grid-template-columns:1fr}}
  .stagecol{padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;border-right:1px solid var(--rule)}
  #stage{border:1px solid var(--rule);cursor:grab;touch-action:none;
    background:conic-gradient(#2a221d 25%,#241d19 0 50%,#2a221d 0 75%,#241d19 0) 0 0/16px 16px}
  #stage:active{cursor:grabbing}
  #view{display:block;width:100%;height:100%;image-rendering:pixelated}
  .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .ctrl{padding:14px 16px;overflow:auto;background:var(--panel)}
  .sec{border-top:1px solid var(--rule);padding-top:10px;margin-top:14px}
  .sec:first-child{border-top:0;margin-top:0;padding-top:0}
  h2{margin:0 0 8px;font:600 11px/1 inherit;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--rule);padding:7px 10px;cursor:pointer;border-radius:2px}
  button:hover{border-color:var(--soft)}
  button[aria-pressed=true]{background:var(--hot);border-color:var(--hot);color:#140c08}
  button.main{background:var(--green);border-color:var(--green);color:#0d1a08}
  .sl{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;min-height:28px}
  .sl output{text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--hot)}
  .tog{display:flex;gap:8px;align-items:center;min-height:28px;cursor:pointer}
  .pal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
  .pal li{display:flex;justify-content:space-between;align-items:center}
  .sw{display:flex}.sw i{width:16px;height:14px;display:block}
  #status{color:var(--soft);min-height:18px;margin:8px 0 0}
  .fail{padding:30px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Doom Slayer · Pixel Rig</h1>
  <p>Rig de primitivas suaves (esferas, cilindros, placas) em three.js, renderizado em baixa resolução com 3 tons + pontilhado + contorno. Nada de cubos.</p>
</header>
<main>
  <section class="stagecol">
    <div id="stage"><canvas id="view"></canvas></div>
    <div class="row" id="views"></div>
    <div class="row">
      <button id="play" aria-pressed="true">⏸ Pausar</button>
      <button id="prev">◀ Quadro</button>
      <button id="next">Quadro ▶</button>
    </div>
    <div style="width:min(420px,100%)">
      <div class="sl"><label for="frame">Quadro</label><input type="range" id="frame" min="0" max="7" step="1" value="0"><output id="frameo">1/8</output></div>
      <div class="sl"><label for="speed">Velocidade</label><input type="range" id="speed" min="0.2" max="2" step="0.05" value="1"><output id="speedo">1×</output></div>
    </div>
    <p id="status"></p>
  </section>

  <section class="ctrl">
    <div class="sec"><h2>Animações</h2><div class="row" id="anims" style="justify-content:flex-start"></div></div>

    <div class="sec">
      <h2>Articulação (edita e congela a pose)</h2>
      <div class="row" id="joints" style="justify-content:flex-start"></div>
      <div class="sl"><label for="jx">Frente ↔ trás</label><input type="range" id="jx" min="-180" max="180" value="0"><output id="jxo">0°</output></div>
      <div class="sl"><label for="jy">Torção</label><input type="range" id="jy" min="-180" max="180" value="0"><output id="jyo">0°</output></div>
      <div class="sl"><label for="jz">Lateral</label><input type="range" id="jz" min="-180" max="180" value="0"><output id="jzo">0°</output></div>
    </div>

    <div class="sec">
      <h2>Câmera</h2>
      <div class="sl"><label for="yaw">Giro</label><input type="range" id="yaw" min="0" max="359" value="35"><output id="yawo">35°</output></div>
      <div class="sl"><label for="pitch">Inclinação</label><input type="range" id="pitch" min="-25" max="50" value="10"><output id="pitcho">10°</output></div>
    </div>

    <div class="sec">
      <h2>Estilo</h2>
      <label class="tog"><input type="checkbox" id="t-outline" checked>Contorno</label>
      <label class="tog"><input type="checkbox" id="t-dither" checked>Pontilhado</label>
      <div class="row" style="justify-content:flex-start;align-items:center;margin-top:6px">
        <label for="res">Resolução</label>
        <select id="res"><option value="64">64 × 64</option><option value="96" selected>96 × 96</option><option value="128">128 × 128</option></select>
      </div>
    </div>

    <div class="sec"><h2>Paleta</h2><ul class="pal" id="pal"></ul></div>

    <div class="sec">
      <h2>Exportar</h2>
      <div class="row" style="justify-content:flex-start;align-items:center;margin-bottom:8px">
        <label for="scale">Escala</label>
        <select id="scale"><option value="1">1×</option><option value="4" selected>4×</option><option value="8">8×</option></select>
      </div>
      <div class="row" style="flex-direction:column;align-items:stretch">
        <button class="main" id="ex-frame">PNG do quadro atual</button>
        <button id="ex-strip">Tira da animação (todos os quadros)</button>
        <button id="ex-sheet">Folha de 8 ângulos (pose atual)</button>
      </div>
    </div>
  </section>
</main>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;

const $ = id => document.getElementById(id);
const D2R = Math.PI / 180;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

/* ---------- paleta: 3 tons por peça (escuro → claro) ---------- */
const PARTS = [
  ['armor',  'Armadura',  ['#17381a', '#3a8a3a', '#8ccf68']],
  ['under',  'Junta',     ['#0e1012', '#2a2e33', '#555b63']],
  ['visor',  'Brilho',    ['#3a2a04', '#c89010', '#ffd840']],
  ['boot',   'Botas',     ['#1e1208', '#4a301a', '#7a5434']],
  ['metal',  'Metal',     ['#202024', '#5a5a64', '#a8a8b4']],
  ['gun',    'Arma',      ['#141416', '#34343a', '#6e6e7a']],
  ['flash',  'Clarão',    ['#ff7a00', '#ffc23a', '#fff4b0']],
  ['orange', 'Traje',     ['#6a2406', '#e0600f', '#ff9a3a']],
  ['skin',   'Braços',    ['#4e2c14', '#a8683a', '#d99a66']],
  ['cloth',  'Couro',     ['#24160c', '#4a3020', '#76543a']],
  ['tan',    'Sola/Placa',['#4a3a2a', '#8a735a', '#c2a888']],
  ['glass',  'Vidro',     ['#08181a', '#2a6a62', '#80c4b2']],
  ['grille', 'Máscara',   ['#040404', '#141418', '#38383e']],
  ['floor',  'Chão',      ['#1c1814', '#3a322a', '#5a5044']],
  ['ledge',  'Plataforma',['#2a2620', '#5a5448', '#8a8270']],
];
const PART_ID = {}; PARTS.forEach((p, i) => PART_ID[p[0]] = i + 1);
const RAMP = [null, ...PARTS.map(p => p[2].map(hex))];
const INK = hex('#0b0908');
const T1 = 0.55, T2 = 0.80;
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v + .5) / 16 - .5);

/* ---------- three.js ---------- */
let W = 96, H = 96;
const stage = $('stage'), view = $('view'), vctx = view.getContext('2d');
let renderer, gl;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  gl = renderer.getContext();
} catch (e) {
  stage.innerHTML = '<div class="fail">WebGL indisponível neste navegador.</div>';
  throw e;
}

const scene = new THREE.Scene();
const FH = 2.3;
const cam = new THREE.OrthographicCamera(-FH / 2, FH / 2, FH / 2, -FH / 2, 0.1, 20);
const rig = new THREE.Group();
rig.position.set(0, 0.95, 0);
rig.add(cam); cam.position.set(0, 0, 6);
scene.add(rig);
scene.add(new THREE.AmbientLight(0xffffff, 0.3 * Math.PI));
const sun = new THREE.DirectionalLight(0xffffff, 0.8 * Math.PI);
sun.position.set(-2.2, 3.2, 4);
rig.add(sun); rig.add(sun.target);

const litMat = new THREE.MeshLambertMaterial({ color: 0xffffff, side: THREE.DoubleSide });
const depthMat = new THREE.MeshDepthMaterial({ side: THREE.DoubleSide });
const idMats = {};
PARTS.forEach(p => { idMats[p[0]] = new THREE.MeshBasicMaterial({ color: new THREE.Color(PART_ID[p[0]] * 16 / 255, 0, 0), side: THREE.DoubleSide }); });

const grp = (parent, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
function mesh(geo, part, x, y, z, parent, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(geo, idMats[part]);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz);
  parent.add(m); return m;
}
const ball = (r, part, x, y, z, p, sx, sy, sz) => mesh(new THREE.SphereGeometry(r, 14, 11), part, x, y, z, p, sx, sy, sz);
function limb(rTop, rBot, len, part, parent, y = 0, sz = 1) {
  const g = new THREE.CylinderGeometry(rTop, rBot, len, 14, 1);
  g.translate(0, -len / 2, 0);
  return mesh(g, part, 0, y, 0, parent, 1, 1, sz);
}
function trunk(rTop, rBot, h, part, parent, x, y, z, sz = 1) {
  const g = new THREE.CylinderGeometry(rTop, rBot, h, 18, 1);
  return mesh(g, part, x, y, z, parent, 1, 1, sz);
}
function tube(r, len, part, parent, x, y, z) {   // cilindro ao longo de +z
  const g = new THREE.CylinderGeometry(r, r, len, 10, 1);
  g.rotateX(Math.PI / 2);
  return mesh(g, part, x, y, z, parent);
}

const model = new THREE.Group(); scene.add(model);
const J = {};
const allMeshes = [];
const ARM_U = 0.30, ARM_F = 0.28;

J.root = grp(model, 0, 1.0, 0);
/* pélvis: cinto de couro com fivela, tassets (abas) marrons, faixa laranja */
trunk(0.15, 0.175, 0.2, 'cloth', J.root, 0, 0.0, 0, 0.78);
trunk(0.185, 0.185, 0.06, 'boot', J.root, 0, 0.09, 0, 0.82);
mesh(new THREE.BoxGeometry(0.15, 0.085, 0.05), 'metal', 0, 0.09, 0.15, J.root);     // fivela
mesh(new THREE.BoxGeometry(0.11, 0.055, 0.03), 'cloth', 0, 0.09, 0.18, J.root);
ball(0.12, 'cloth', 0, -0.17, 0.14, J.root, 1.0, 1.6, 0.22);                         // aba frontal
ball(0.115, 'cloth', 0, -0.17, -0.14, J.root, 1.0, 1.6, 0.22);                       // aba traseira
ball(0.06, 'metal', 0, -0.33, 0.15, J.root, 1.4, 0.18, 0.3);                         // ponta da aba
ball(0.075, 'cloth', 0.17, -0.02, 0.0, J.root, 0.7, 1.2, 1.1);                       // bolsas laterais
ball(0.075, 'cloth', -0.17, -0.02, 0.0, J.root, 0.7, 1.2, 1.1);

J.spine = grp(J.root, 0, 0.1, 0);
trunk(0.15, 0.15, 0.22, 'orange', J.spine, 0, 0.1, 0, 0.78);                          // abdômen laranja
trunk(0.235, 0.17, 0.34, 'armor', J.spine, 0, 0.31, 0, 0.74);                         // peitoral
ball(0.14, 'armor', 0, 0.36, 0.09, J.spine, 1.25, 0.75, 0.55);                        // placa do peito
for (let i = 0; i < 3; i++) ball(0.1, 'under', 0, 0.2 + i * 0.045, 0.145 + i * 0.006, J.spine, 1, 0.1, 0.32);  // sulcos
ball(0.04, 'metal', 0.05, 0.43, 0.15, J.spine, 1, 0.8, 0.6);
ball(0.02, 'flash', -0.09, 0.3, 0.145, J.spine, 1, 1, 0.5);                           // luz
trunk(0.12, 0.14, 0.05, 'orange', J.spine, 0, 0.52, 0, 0.8);                          // gola laranja

/* pescoço e cabeça: capacete, vidro verde-azulado, máscara com respirador e tubo */
J.neck = grp(J.spine, 0, 0.5, 0);
trunk(0.05, 0.06, 0.1, 'orange', J.neck, 0, 0.02, 0, 1);
J.head = grp(J.neck, 0, 0.06, 0);
ball(0.14, 'armor', 0, 0.13, -0.005, J.head, 1, 1.06, 1.12);
ball(0.115, 'glass', 0, 0.15, 0.08, J.head, 1.0, 0.72, 0.62);                         // visor
ball(0.085, 'grille', 0, 0.055, 0.1, J.head, 1.0, 0.85, 0.7);                         // máscara
for (let i = -1; i <= 1; i++) ball(0.012, 'under', i * 0.03, 0.055, 0.168, J.head, 1, 1, 0.5);   // grade
ball(0.014, 'visor', 0.062, 0.07, 0.15, J.head); ball(0.014, 'visor', -0.062, 0.07, 0.15, J.head);   // brilhos
ball(0.012, 'flash', 0.045, 0.165, 0.15, J.head);                                      // olho vermelho/laranja
{ const t = tube(0.014, 0.28, 'grille', J.head, 0.1, 0.07, -0.05); t.rotation.y = -0.55; }   // tubo do respirador
ball(0.045, 'metal', 0.13, 0.12, 0.0, J.head, 0.5, 1.2, 1.2);
ball(0.045, 'metal', -0.13, 0.12, 0.0, J.head, 0.5, 1.2, 1.2);
ball(0.05, 'armor', 0, 0.255, -0.03, J.head, 0.5, 0.6, 1.8);                           // crista
ball(0.09, 'armor', 0, 0.085, -0.1, J.head, 1.1, 0.8, 0.8);                            // nuca

/* braços: bronze nus, braçadeira escura, luva marrom; esquerdo com escudo verde */
function buildArm(side, tag) {
  ball(0.14, 'armor', side * 0.26, 0.44, 0, J.spine, 1.1, 0.9, 1.0);                  // ombreira
  ball(0.05, 'under', side * 0.26, 0.5, 0.03, J.spine, 1.4, 0.4, 1.1);                 // detalhe da ombreira
  const sh = J['sh' + tag] = grp(J.spine, side * 0.25, 0.4, 0);
  ball(0.075, 'skin', 0, 0, 0, sh);
  limb(0.078, 0.07, ARM_U, 'skin', sh, 0);
  const el = J['el' + tag] = grp(sh, 0, -ARM_U, 0);
  ball(0.07, 'skin', 0, 0, 0, el);
  limb(0.07, 0.065, ARM_F, 'skin', el, 0);
  limb(0.072, 0.07, 0.07, 'under', el, -ARM_F + 0.08);                                 // faixa do pulso
  if (tag === 'L') ball(0.09, 'armor', 0.04, -0.12, 0.02, el, 0.8, 1.6, 1.0);         // escudo no antebraço
  const wr = J['wr' + tag] = grp(el, 0, -ARM_F, 0);
  ball(0.072, 'cloth', 0, -0.04, 0.005, wr, 1, 1.05, 1.1);                             // luva
  ball(0.04, 'tan', 0, -0.05, 0.05, wr, 1.3, 0.7, 0.6);                                // nós dos dedos
}
buildArm(1, 'L'); buildArm(-1, 'R');

/* pernas: coxote verde com friso cinza, joelheira bege, bota alta marrom com sola clara */
function buildLeg(side, tag) {
  const hip = J['hip' + tag] = grp(J.root, side * 0.1, -0.06, 0);
  ball(0.085, 'cloth', 0, 0, 0, hip);
  limb(0.095, 0.075, 0.45, 'armor', hip);
  ball(0.05, 'armor', side * 0.075, -0.17, 0.02, hip, 0.5, 2.2, 1.3);                   // placa lateral
  ball(0.045, 'metal', side * 0.1, -0.17, 0.02, hip, 0.3, 2.4, 1.0);                    // friso cinza
  const kn = J['kn' + tag] = grp(hip, 0, -0.45, 0);
  ball(0.075, 'under', 0, 0, 0, kn);
  ball(0.09, 'tan', 0, 0.0, 0.05, kn, 1.1, 1.0, 0.8);                                   // joelheira
  ball(0.03, 'under', 0, 0.0, 0.12, kn, 2, 1.0, 0.4);
  limb(0.075, 0.062, 0.43, 'boot', kn);                                                 // cano da bota
  for (let i = 0; i < 4; i++) ball(0.05, 'under', 0, -0.12 - i * 0.055, 0.06, kn, 1.1, 0.12, 0.5);   // cadarço
  ball(0.07, 'tan', 0, -0.2, 0.045, kn, 0.9, 1.5, 0.55);                                // placa da canela
  const an = J['an' + tag] = grp(kn, 0, -0.43, 0);
  trunk(0.068, 0.078, 0.2, 'boot', an, 0, 0.0, 0, 1);
  const g = new THREE.CapsuleGeometry(0.062, 0.14, 6, 12); g.rotateX(Math.PI / 2);
  mesh(g, 'boot', 0, -0.075, 0.075, an, 1.05, 0.82, 1);
  ball(0.065, 'tan', 0, -0.122, 0.08, an, 1.0, 0.28, 2.1);                              // sola
  ball(0.05, 'tan', 0, -0.082, 0.165, an, 1.0, 0.75, 0.8);                              // biqueira
  ball(0.04, 'metal', 0, 0.1, 0.0, an, 1.7, 0.4, 1.7);                                  // aro
}

buildLeg(1, 'L'); buildLeg(-1, 'R');

/* espingarda (filha do tronco, as mãos usam IK para segurá-la) */
const G = grp(J.spine, -0.1, 0.12, 0.26);
const pumpG = grp(G, 0, -0.01, 0.3);
(function () {
  mesh(new THREE.BoxGeometry(0.07, 0.085, 0.3), 'gun', 0, 0, 0.0, G);
  ball(0.045, 'gun', 0, 0, 0.15, G, 0.85, 0.9, 0.8);
  tube(0.026, 0.62, 'metal', G, 0, 0.018, 0.4);
  tube(0.022, 0.55, 'gun', G, 0, -0.025, 0.36);
  mesh(new THREE.BoxGeometry(0.06, 0.1, 0.22), 'gun', 0, -0.015, -0.24, G);
  ball(0.05, 'gun', 0, -0.025, -0.37, G, 0.8, 1.5, 0.7);
  mesh(new THREE.BoxGeometry(0.045, 0.1, 0.05), 'gun', 0, -0.09, -0.06, G).rotation.x = 0.35;
  const pm = tube(0.04, 0.16, 'metal', pumpG, 0, 0, 0);
  const flash = ball(0.09, 'flash', 0, 0.018, 0.78, G, 1, 1, 2.2);
  flash.visible = false; G.userData.flash = flash;
})();
const GUN_REST = new THREE.Vector3(-0.1, 0.12, 0.26), GUN_AIM = new THREE.Vector3(-0.17, 0.37, 0.52);
const GRIP_R = new THREE.Vector3(0, -0.075, -0.07);

model.traverse(o => { if (o.isMesh) allMeshes.push(o); });

/* cenário das animações de pulo: chão + degrau (fora do rig, não entra no cálculo de apoio dos pés) */
const props = new THREE.Group(); scene.add(props); props.visible = false;
const floorM = mesh(new THREE.BoxGeometry(3.2, 0.1, 3.2), 'floor', 0, -0.05, 0, props);
const LEDGE_H = 0.7, LEDGE_EDGE = 0.2;
const ledgeM = mesh(new THREE.BoxGeometry(1.2, LEDGE_H, 1.6), 'ledge', 0, LEDGE_H / 2, 0, props);
mesh(new THREE.BoxGeometry(1.24, 0.06, 1.64), 'tan', 0, LEDGE_H / 2 - 0.03, 0, ledgeM);

/* ---------- IK de 2 ossos: leva o pulso até um ponto no espaço do tronco ---------- */
const DOWN = new THREE.Vector3(0, -1, 0);
const _t = new THREE.Vector3(), _p = new THREE.Vector3(), _e = new THREE.Vector3(), _dU = new THREE.Vector3(), _dF = new THREE.Vector3();
const _q = new THREE.Quaternion();
function solveArm(tag, side, T) {
  const sh = J['sh' + tag], el = J['el' + tag], a = ARM_U, b = ARM_F;
  const dv = _t.copy(T).sub(sh.position);
  const d = Math.min(Math.max(dv.length(), 0.08), (a + b) * 0.995);
  const u = dv.normalize();
  const along = (a * a - b * b + d * d) / (2 * d), h = Math.sqrt(Math.max(0, a * a - along * along));
  _p.set(side * 0.7, -1, -0.25);
  _p.addScaledVector(u, -_p.dot(u)).normalize();
  _e.copy(sh.position).addScaledVector(u, along).addScaledVector(_p, h);
  _dU.copy(_e).sub(sh.position).normalize();
  _dF.copy(sh.position).addScaledVector(u, d).sub(_e).normalize();
  sh.quaternion.setFromUnitVectors(DOWN, _dU);
  _q.copy(sh.quaternion).invert();
  _dF.applyQuaternion(_q);
  el.quaternion.setFromUnitVectors(DOWN, _dF);
}

/* ---------- animações ---------- */
const JOINTS = [

});
$('play').onclick = () => {
  state.playing = !state.playing; state.manual = state.playing ? null : state.manual;
  $('play').setAttribute('aria-pressed', state.playing); $('play').textContent = state.playing ? '⏸ Pausar' : '▶ Tocar';
};
$('prev').onclick = () => setFrame(state.frame - 1);
$('next').onclick = () => setFrame(state.frame + 1);
$('frame').oninput = e => setFrame(+e.target.value);
$('speed').oninput = e => { state.speed = +e.target.value; $('speedo').textContent = state.speed + '×'; };

[['Perfil →', 90], ['3/4 frente', 35], ['Frente', 0], ['Costas', 180], ['Perfil ←', 270]].forEach(([l, y]) => {
  const b = document.createElement('button'); b.textContent = l;
  b.onclick = () => { setYaw(y); }; $('views').appendChild(b);
});
function setYaw(y) { state.yaw = ((y % 360) + 360) % 360; $('yaw').value = Math.round(state.yaw); $('yawo').textContent = Math.round(state.yaw) + '°'; queue(); }
$('yaw').oninput = e => setYaw(+e.target.value);
$('pitch').oninput = e => { state.pitch = +e.target.value; $('pitcho').textContent = state.pitch + '°'; queue(); };
$('t-outline').onchange = e => { state.outline = e.target.checked; queue(); };
$('t-dither').onchange = e => { state.dither = e.target.checked; queue(); };
$('res').onchange = e => { W = H = +e.target.value; layoutStage(); queue(); };
window.addEventListener('resize', () => { layoutStage(); queue(); });

/* articulações: ler os ângulos atuais; editar congela a pose em modo FK */
JOINTS.forEach(([k, label]) => {
  const b = document.createElement('button'); b.textContent = label; b.dataset.k = k;
  b.setAttribute('aria-pressed', k === state.sel);
  b.onclick = () => { state.sel = k; document.querySelectorAll('#joints button').forEach(c => c.setAttribute('aria-pressed', c.dataset.k === k)); syncJointSliders(); };
  $('joints').appendChild(b);
});
let editing = false;
function syncJointSliders() {
  if (editing) return;
  const r = J[state.sel].rotation;
  ['x', 'y', 'z'].forEach(ax => { const v = Math.round(r[ax] / D2R); $('j' + ax).value = v; $('j' + ax + 'o').textContent = v + '°'; });
}
['x', 'y', 'z'].forEach((ax, i) => {
  $('j' + ax).oninput = e => {
    if (!state.manual) {              // congela a pose atual (inclusive braços resolvidos por IK) em FK
      const cur = currentPose(), j = {};
      JOINTS.forEach(([n]) => { const r = J[n].rotation; j[n] = [r.x / D2R, r.y / D2R, r.z / D2R]; });
      state.manual = Object.assign({}, cur, { j, fk: true });
      state.playing = false; $('play').setAttribute('aria-pressed', false); $('play').textContent = '▶ Tocar';
    }
    const a = state.manual.j[state.sel].slice(); a[i] = +e.target.value; state.manual.j[state.sel] = a;
    $('j' + ax + 'o').textContent = a[i] + '°';
    editing = true; draw(); editing = false;
  };
});

/* arrastar o palco gira o boneco */
let drag = null;
stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw: state.yaw, pitch: state.pitch }; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  setYaw(drag.yaw + (e.clientX - drag.x) * 0.9);
  state.pitch = Math.max(-25, Math.min(50, drag.pitch + (e.clientY - drag.y) * 0.4));
  $('pitch').value = Math.round(state.pitch); $('pitcho').textContent = Math.round(state.pitch) + '°';
});
stage.addEventListener('pointerup', () => drag = null);
stage.addEventListener('pointercancel', () => drag = null);

PARTS.forEach(p => {
  const li = document.createElement('li'), n = document.createElement('span'), sw = document.createElement('span');
  n.textContent = p[1]; sw.className = 'sw';
  p[2].forEach(c => { const i = document.createElement('i'); i.style.background = c; sw.appendChild(i); });
  li.append(n, sw); $('pal').appendChild(li);
});

/* ---------- exportação ---------- */
const say = t => $('status').textContent = t;
function toCanvas(img) { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').putImageData(img, 0, 0); return c; }
function scaled(src, s) {
  if (s === 1) return src;
  const o = document.createElement('canvas'); o.width = src.width * s; o.height = src.height * s;
  const g = o.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(src, 0, 0, o.width, o.height); return o;
}
function save(canvas, name) {
  canvas.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    say(name + ' · ' + canvas.width + '×' + canvas.height);
  }, 'image/png');
}
const exScale = () => +$('scale').value;
$('ex-frame').onclick = () => save(scaled(toCanvas(renderPose(currentPose(), W, H)), exScale()), `slayer-${state.anim}-${state.frame}.png`);
$('ex-strip').onclick = () => {
  const A = ANIMS[state.anim], c = document.createElement('canvas'); c.width = W * A.frames; c.height = H;
  const g = c.getContext('2d');
  for (let i = 0; i < A.frames; i++) g.putImageData(renderPose(poseAt(state.anim, i), W, H), i * W, 0);
  save(scaled(c, exScale()), `slayer-${state.anim}-strip${A.frames}.png`);
};
$('ex-sheet').onclick = () => {
  const keep = state.yaw, c = document.createElement('canvas'); c.width = W * 8; c.height = H;
  const g = c.getContext('2d'), p = currentPose();
  for (let i = 0; i < 8; i++) { state.yaw = i * 45; g.putImageData(renderPose(p, W, H), i * W, 0); }
  state.yaw = keep; queue();
  save(scaled(c, exScale()), `slayer-${state.anim}-8dir.png`);
};

/* usado por scripts/render_doom_sprites.py: renderiza um quadro com fundo transparente, sem cenário nem deslocamento */
function renderAt(anim, t, yaw, pitch, res) {
  state.yaw = yaw; state.pitch = pitch; W = H = res;
  const pose = ANIMS[anim].fn(t);
  if (pose.prop) pose.lift = 0;
  pose.prop = null; pose.dz = 0;
  return toCanvas(renderPose(pose, W, H)).toDataURL('image/png');
}
window.__rig = { renderAt, state, setAnim, setFrame, setYaw, queue, THREE, J, draw };
layoutStage(); setAnim('walk'); requestAnimationFrame(tick);
</script>
</body>
